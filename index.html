<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Explorer: Continents and Oceans</title>
<style>
:root{--navy:#0B2545;--ink:#14213D;--bg:#F2F8FF;--card:#fff;--line:#D6E4F0;--blue:#1D6FD8;--good:#1E8E3E;--bad:#C62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:860px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:5}
.ttl{font-weight:800;font-size:19px;color:var(--navy)}
.back{border:0;background:#fff;border-radius:12px;width:44px;height:40px;font-size:20px;box-shadow:0 1px 0 var(--line)}
.stars{background:#FFF4CC;color:#7A5200;border-radius:20px;padding:4px 12px;font-weight:800}
.stars.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.25)}}
.hero{text-align:center;padding:6px 4px 4px}
.hero h1{font-size:22px;margin:4px 0;color:var(--navy)}
.hero p{margin:0 0 8px;color:#3a4a63}
.pals{font-size:40px}
.wmap{width:100%;height:auto;display:block}
.mapbox{background:#fff;border-radius:16px;padding:6px;border:2px solid var(--line);margin:8px 0}
.tapme{cursor:pointer}
.land{transition:stroke-width .15s}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.45;transform:scale(1.12)}}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.zones.one{grid-template-columns:1fr}
.zone{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;border:0;border-radius:16px;padding:14px;background:#fff;border-top:7px solid var(--zc);box-shadow:0 2px 0 var(--line);font:inherit;color:var(--ink);text-decoration:none}
.zone:active{transform:scale(.98)}
.ze{font-size:30px}.zt{font-weight:800;font-size:18px;color:var(--navy)}.zs{font-size:14px;color:#4a5a73}
.badge{position:absolute;top:10px;right:10px;background:#E7F6EC;color:var(--good);font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.wide{display:block;width:100%;margin:10px 0;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:18px;color:var(--navy)}
.go{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.tiny{font-size:13px;color:#4a5a73}
.lead{margin:4px 2px 6px;font-weight:600;color:#33435c}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;border:2px solid var(--line)}
.card.center{text-align:center}
.ch{font-weight:800;font-size:18px;color:var(--navy);border-left:6px solid #3FB8AF;padding-left:8px;margin-bottom:8px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{border:2px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-weight:700}
.tg.on{background:#E3F0FF;border-color:var(--blue)}
.info{background:#fff;border-radius:14px;padding:12px;margin-top:10px;border:2px dashed #9cc9e6;min-height:60px}
.ibig{font-size:21px;font-weight:800;color:var(--navy)}
.mini{display:grid;gap:4px;margin-top:6px;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mi{display:flex;justify-content:space-between;font-size:14px;padding:6px 8px;border-radius:10px;background:#F4F7FA}
.mi.m3{background:#E7F6EC}.mi.m1{background:#FFF7DD}
.vcard .vw{font-size:24px;font-weight:800;color:var(--blue)}
.vcard .vd{font-size:17px;margin:2px 0 8px}
.trick{background:#FFF7DD;border-radius:12px;padding:10px;margin-top:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--cc);background:#fff;border-radius:20px;padding:6px 10px;font-weight:700;font-size:14px}
.chip.on{background:var(--cc)}
.flist{display:grid;gap:6px;margin:8px 0}
.fi{display:flex;align-items:center;gap:8px;font-weight:700;padding:6px 8px;border-radius:10px}
.fi.mtn{background:#F6EDE4}.fi.water{background:#E3F0FF}
.fn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:14px}
.fi.mtn .fn{background:#7A5230}.fi.water .fn{background:#1D6FD8}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.area{background:#F4F9F2;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.ae{font-size:30px}
.prog{height:12px;background:#E1EAF3;border-radius:8px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,#3FB8AF,#7CC35A)}
.qn{font-size:13px;color:#4a5a73;margin:4px 0}
.q{font-size:21px;font-weight:700;color:var(--navy);margin:6px 0}
.qe{font-size:30px;margin-right:6px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.opt{min-height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;padding:8px}
.opt:active{transform:scale(.98)}
.opt.wrongb{background:#FDECEC;border-color:var(--bad);opacity:.7}
.opt.right{background:#E7F6EC;border-color:var(--good)}
.fb{margin-top:10px;border-radius:14px;padding:0}
.fb.good{background:#E7F6EC;padding:12px;border:2px solid #9ad3a8}
.fb.bad{background:#FDECEC;padding:12px;border:2px solid #f2b0b0}
.spell{display:flex;gap:8px;margin-top:10px}
.spell input{flex:1;font:inherit;font-size:22px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);min-width:0}
.spell button{border-radius:12px;border:0;padding:0 16px;font-weight:800}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-top:4px}
.hintb{border:0;background:none;color:var(--blue);font-weight:700;padding:4px 0}
.lok{color:var(--good);font-weight:800}.lbad{color:var(--bad);font-weight:800;text-decoration:underline}
.miss{border-top:1px dashed var(--line);padding:8px 0}
.miss .ok{color:var(--good);font-weight:800}
.starrow{font-size:30px;letter-spacing:4px}
.lst{text-align:left;display:inline-block}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf span{position:absolute;top:-30px;font-size:26px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(260deg)}}
.filelink{margin:10px 0}
.scene{width:100%;height:auto;display:block;border-radius:12px;margin:0 auto}
.scenebox{margin:8px 0;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-weight:800;color:var(--navy)}
.trio div{background:#F4F9F2;border-radius:12px;padding:8px}.trio span{display:block;font-size:34px}
.center{text-align:center}
.fcs{display:grid;gap:6px}.fcr{display:flex;gap:10px;align-items:center;background:#F7FAFD;border-radius:12px;padding:8px 10px;font-size:15px}.fcr span{font-size:28px}
.big{font-size:20px;padding:16px}
.packgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.pk{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pk span{font-size:34px}.pk.right{background:#E7F6EC;border-color:var(--good)}.pk.wrongb{background:#FDECEC;border-color:var(--bad);opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.tile{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;animation:popin .4s both}
.tile.sea{background:#BFE3FA;border:2px solid #4FA8E0}.tile.landt{background:#CDEBB8;border:2px solid #6DAA45}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.tcount{display:flex;gap:12px;justify-content:center;font-weight:800}
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:13px;font-weight:700;margin-top:8px}.uses div{background:#EEF6FD;border-radius:10px;padding:6px}.uses span{display:block;font-size:28px}
.pbar{display:grid;grid-template-columns:118px 1fr;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pn{font-weight:800}.pr{font-size:17px;letter-spacing:-4px;white-space:nowrap;overflow:hidden}
.tinyp{font-size:9px;letter-spacing:0}.pl{grid-column:2;font-size:12px;color:#4a5a73}
.half{display:inline-block;overflow:hidden;vertical-align:bottom}.pz{font-size:13px;letter-spacing:0;color:#4a5a73;font-weight:700}
.say{border:0;background:#E3F0FF;border-radius:50%;width:34px;height:34px;font-size:17px;vertical-align:middle;margin-left:4px;padding:0}
.ckey{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-weight:700;margin:6px 2px}
.sup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sup div{background:#FFF7DD;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center}.sup span{font-size:30px}.sup small{font-size:12px;color:#4a5a73;font-weight:700}.sup b{font-size:17px;color:var(--navy)}
.pg{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center;padding:5px 0;font-size:14px;font-weight:700}.pgb{height:12px;background:#E1EAF3;border-radius:8px;overflow:hidden}.pgb div{height:100%}.pgs{text-align:right;color:#4a5a73;font-size:13px}
.found{font-weight:800;text-align:center;color:var(--navy)}
.vlist{display:grid;gap:6px;margin-top:6px}.vi{display:flex;gap:8px;align-items:center;background:#E7F6EC;border-radius:10px;padding:6px 10px;font-size:15px;animation:popin .3s}.vi span{font-size:26px}

.globebox svg{display:block;width:100%;max-width:520px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.whyt{margin:4px 0 6px}.why .ch{border-left-color:#C62828}
@media (prefers-reduced-motion:reduce){.pulse,.conf span,.stars.pop{animation:none}}
@media (min-width:700px){.opts{grid-template-columns:repeat(4,minmax(0,1fr))}.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>

function oceanAt(lon, lat) {

  let d;
  if (lat > 50) d = -130; else if (lat > 30) d = -118; else if (lat > 18) d = -100; else if (lat > 15) d = -94; else if (lat > 8) d = -84; else if (lat > -5) d = -79; else if (lat > -56) d = -72; else d = -67;

function placeDistractors(id, n = 3) {

    let tot = 0; const ww = pool.map((k, j) => (k === last ? 0 : w[j] / (1 + out.filter(x => x === k).length * 2))); ww.forEach(v => tot += v);

}

function runRound(cfg) {
  const { qs, mode } = cfg; let i = 0, score = 0, tries = 0; const log = [];
  const next = () => { i++; tries = 0; if (i >= qs.length) return finish(); show(); };
  function finish() {
    const n = qs.length; const best = S.best[cfg.key];
    if (best == null || score > best) S.best[cfg.key] = score; save();
    const pct = score / n; const pal = pct >= 0.9 ? '🐻‍❄️🎉' : pct >= 0.7 ? '🐢👍' : '🐧💪';
    const msg = pct >= 0.9 ? 'Amazing! You are ready!' : pct >= 0.7 ? 'Great work! Look at the ones to fix below.' : 'Good practice! Let\'s look at these and try again.';
    const misses = log.filter(l => !l.ok);
    app().innerHTML = header(cfg.title) + `<div class="card center"><div style="font-size:60px">${pal}</div><h2>${score} / ${n}</h2><p>${msg}</p><div class="starrow">${'⭐'.repeat(Math.round(pct * 5))}${'☆'.repeat(5 - Math.round(pct * 5))}</div></div>
    ${misses.length ? `<div class="card"><div class="ch">🔧 Let's fix these</div>${misses.map(m => `<div class="miss"><div>${m.q}</div><div>Your answer: <s>${esc(m.got)}</s></div><div class="ok">✅ ${esc(m.right)}</div><div class="tiny">${m.why || ''}</div></div>`).join('')}</div>` : ''}
    <button class="wide go" id="again">Play again ↻</button><button class="wide" data-go="home">Home 🏠</button>`;
    bindGo(app()); $('#again').onclick = cfg.again;
    if (mode === 'test') addStar(score);
  }
  function answerText(q, v) { if (q.kind === 'tap') return v && PLACES[v] ? PLACES[v].name : (v === 'med' ? 'Mediterranean Sea' : 'somewhere else'); if (q.kind === 'hemi') return ({ N: 'Northern', S: 'Southern', E: 'Eastern', W: 'Western' })[v] || '—'; if (q.kind === 'mc') { const o = q.options.find(o => o.v === v); return o ? o.t : v; } return v; }
  function rightText(q) { if (q.kind === 'tap') return PLACES[q.answer].name; if (q.kind === 'hemi') return ({ N: 'Northern', S: 'Southern', E: 'Eastern', W: 'Western' })[q.answer] + ' Hemisphere'; if (q.kind === 'mc') return q.options.find(o => o.v === q.answer).t; return q.answer; }
  function result(q, ok, got) {
    if (q.id) mark(q.id, ok);
    if (mode === 'test') { log.push({ q: q.prompt, ok, got: answerText(q, got), right: rightText(q), why: q.why }); if (ok) score++; return next(); }
    const fb = $('#fb');
    if (ok) {
      if (tries === 0) { score++; addStar(); }
      log.push({ q: q.prompt, ok: tries === 0, got: answerText(q, got), right: rightText(q), why: q.why });
      fb.className = 'fb good'; fb.innerHTML = `<b>${pick(CHEERS)}</b> ${q.kind === 'tap' ? PLACES[q.answer].emoji + ' ' + PLACES[q.answer].fact : (q.why || '')}<button class="wide go" id="nx">Next ▶</button>`;
      app().querySelectorAll('.opt').forEach(b => b.disabled = true);
      $('#nx').onclick = next; confetti();
    } else {
      tries++;
      let hint = '';
      if (q.kind === 'tap') hint = got === 'med' ? 'That\'s the Mediterranean Sea, not an ocean.' : got && PLACES[got] ? `That's the <b>${PLACES[got].name}</b>. ${got === 'arctic' && q.answer === 'atlantic' ? 'The Arctic is at the top. The Atlantic is in the middle!' : got === 'atlantic' && q.answer === 'arctic' ? 'The Atlantic is in the middle. The Arctic is at the very top!' : ''}` : 'Try tapping right on the place.';
      else if (q.kind === 'hemi') hint = q.why;
      else if (q.kind === 'spell') hint = spellDiff(got, q.answer);
      else hint = 'Not quite. Try again!';
      if (tries >= 2) {

        fb.className = 'fb bad'; fb.innerHTML = `${hint}<div>The answer is <b>${esc(rightText(q))}</b>. ${q.why || ''}</div><button class="wide go" id="nx">Next ▶</button>`;
        if (q.kind === 'tap') { const svg = $('#qm svg'); if (PLACES[q.answer].type === 'c') svg.querySelector(`[data-id="${q.answer}"]`).setAttribute('stroke-width', 6); else svg.insertAdjacentHTML('afterbegin', ''), svg.insertAdjacentHTML('beforeend', labelSVG(q.answer, 30)); }

function packGame() {
  const rounds = shuffle(PACK); let i = 0, score = 0;
  const show = () => {
    const r = rounds[i]; const items = shuffle(r.ok.map(x => [...x, 1]).concat(r.no.map(x => [...x, 0])));
    let picked = new Set(), wrong = 0;
    app().innerHTML = header('Pack for the trip') + `<div class="prog"><div style="width:${i / rounds.length * 100}%"></div></div><div class="qn">Trip ${i + 1} of ${rounds.length}</div>
    <div class="q">🎒 You're going to <b>${SCENES[r.k].to}</b>! Pick the <b>2 things</b> you need.</div>
    <div class="scenebox">${sceneSVG(r.k, 200)}</div>
    <div class="packgrid">${items.map((it, j) => `<button class="pk" data-j="${j}"><span>${it[0]}</span>${it[1]}</button>`).join('')}</div>
    <div id="fb" class="fb"></div>`;
    bindGo(app());
    app().querySelectorAll('.pk').forEach(b => b.onclick = () => {
      if (picked.size >= 2) return;
      const it = items[+b.dataset.j];
      if (it[2]) { picked.add(+b.dataset.j); b.classList.add('right'); b.disabled = true; }
      else { wrong++; b.classList.add('wrongb'); b.disabled = true; $('#fb').className = 'fb bad'; $('#fb').innerHTML = `Hmm, a ${it[1]} won't help much in ${SCENES[r.k].to}. Try again!`; }
      if (picked.size === 2) {
        if (wrong === 0) { score++; addStar(); }
        confetti();
        $('#fb').className = 'fb good';
        $('#fb').innerHTML = `<b>${pick(CHEERS)}</b> Packed and ready! ${SCENES[r.k].e} People there wear <b>${SCENES[r.k].cloth}</b>.<button class="wide go" id="nx">Next trip ▶</button>`;
        $('#nx').onclick = () => { i++; if (i >= rounds.length) done(); else show(); };
      }
    });
  };
  const done = () => {
    const best = S.best.pack; if (best == null || score > best) S.best.pack = score; save();
    app().innerHTML = header('Pack for the trip') + `<div class="card center"><div style="font-size:60px">🎒🌍</div><h2>${score} / ${rounds.length} perfect packs</h2><p>${score >= 5 ? 'Super traveler!' : 'Nice packing! Try again for a perfect score.'}</p></div>
    <button class="wide go" id="again">Play again ↻</button><button class="wide" data-go="lifelab">Back to Life lab</button>`;
    bindGo(app()); $('#again').onclick = packGame;
  };
  show();
}
